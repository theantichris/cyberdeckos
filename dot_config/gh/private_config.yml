version: 1
git_protocol: ssh
editor:
prompt: enabled
prefer_editor_prompt: disabled
expiring_credentials: disabled
pager:
aliases:
    cl: repo clone
    co: pr checkout
    cr: pr create --web
    rv: repo view --web
http_unix_socket:
browser:
clipboard: enabled
color_labels: enabled
accessible_colors: disabled
accessible_prompter: disabled
spinner: enabled
